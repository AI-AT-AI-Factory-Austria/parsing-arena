[project]
name = "ocr-arena-backend"
version = "0.1.0"
description = "OCR Arena API: run open OCR models and LlamaParse side by side"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "markdown>=3.6",
    "huggingface-hub>=0.26",
    "llama-cloud>=1.4.1",
    "beautifulsoup4>=4.13",
    "markdown2>=2.5.5",
    "mineru-vl-utils>=2.0.8,<2.1",
    "pypdf>=6.0",
    "pytesseract>=0.3.13",
    "psutil>=7.0",
]

[project.optional-dependencies]
# Local inference. PyTorch itself is installed separately because the right build
# depends on the hardware (see scripts/install-torch.ps1 / .sh).
local = [
    "einops>=0.8.1",
    "docling>=2.140",
    "opendataloader-pdf[hybrid]==2.5.18",
    "python-doctr==1.1.0",
    "timm>=1.0.22",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false
# PyTorch comes from scripts/install-torch (the right build for the hardware).
# This marker never matches, so nothing in the lockfile installs a generic build.
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    "app/engines/kdl/kdl_frontier_nano.py",
    "app/engines/kdl/florin_emission.py",
    "app/engines/vendor/parsebench_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
